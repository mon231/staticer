name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest

    # Windows runners ship MSVC but do not put cl.exe on PATH by default.
    # The compiler is only used by the test suite to build fixtures; the
    # installed staticer package stays pure-Python.
    - name: Put MSVC cl.exe on PATH (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # ubuntu-latest already provides gcc and clang, so no extra setup is needed.

    - name: Run tests
      run: pytest -v
